<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Team vs Team 🏆</title>
<link rel="stylesheet" href="../assets/style.css">
</head><body class="game-bg">
<div class="game-wrap">
  <div class="top-bar">
    <a href="../index.html" class="back">← Hub</a>
    <h1 class="game-title">🏆 Team vs Team</h1>
    <a href="leaderboard.html" class="back">🏆 Board</a>
  </div>

  <div class="big-q" id="q">Press Next ▶</div>

  <div class="teams">
    <div class="team tA" id="teamA">
      <input class="name-edit" id="nA" value="Team A" maxlength="20">
      <div class="score" id="sA">0</div>
    </div>
    <div class="team tB" id="teamB">
      <input class="name-edit" id="nB" value="Team B" maxlength="20">
      <div class="score" id="sB">0</div>
    </div>
  </div>

  <div class="qbox" style="padding:20px">
    <div style="font-size:60px;font-weight:bold;color:#ffd700" id="answer">_</div>
    <div class="info">Tap Reveal to show answer · Tap +1 for the team that answered first</div>
  </div>

  <!-- Touch controls — no keyboard needed -->
  <div class="touch-controls">
    <button class="tc-btn tc-a" onclick="pt('A',+1)">🔴 A +1</button>
    <button class="tc-btn tc-yellow" onclick="reveal()">👁 Reveal</button>
    <button class="tc-btn tc-b" onclick="pt('B',+1)">🔵 B +1</button>

    <button class="tc-btn tc-minus" onclick="pt('A',-1)">A −1</button>
    <button class="tc-btn tc-green" onclick="nextQ()">⏭ Next Question</button>
    <button class="tc-btn tc-minus" onclick="pt('B',-1)">B −1</button>
  </div>

  <div class="controls" style="margin-top:24px">
    <button class="btn btn-danger" onclick="finish()">🏁 Finish & Save</button>
    <button class="btn btn-secondary" onclick="resetAll()">↺ Reset</button>
    <select class="btn btn-secondary" id="diff">
      <option value="easy">Easy</option>
      <option value="medium" selected>Medium</option>
      <option value="hard">Hard</option>
      <option value="tables">Tables (×)</option>
    </select>
  </div>
</div>

<div id="endC" class="overlay hidden">
  <div class="overlay-card">
    <h1 id="endTitle">🏆 Match Result</h1>
    <div class="big" id="endWin">—</div>
    <p id="endMsg"></p>
    <button class="btn btn-primary" onclick="resetAll()">New Match</button>
    <a href="leaderboard.html" class="btn btn-secondary" style="text-decoration:none;display:inline-block">View Board</a>
  </div>
</div>

<script src="../assets/game.js"></script>
<script>
let sA=0,sB=0,cur=null;
const $=id=>document.getElementById(id);

function nextQ(){
  cur = Q[$('diff').value]();
  $('q').textContent = cur.text + ' = ?';
  $('answer').textContent = '_';
}
function reveal(){
  if(!cur) return;
  $('answer').textContent = cur.ans;
  ok();
}
function pt(team,delta){
  if(team==='A'){ sA=Math.max(0,sA+delta); $('sA').textContent=sA; flash('teamA'); }
  else         { sB=Math.max(0,sB+delta); $('sB').textContent=sB; flash('teamB'); }
  delta>0?ok():bad();
}
function flash(id){
  $(id).classList.add('active');
  setTimeout(()=>$(id).classList.remove('active'),400);
}
function finish(){
  win();
  const nA = $('nA').value || 'Team A';
  const nB = $('nB').value || 'Team B';
  const winner = sA>sB?nA : sB>sA?nB : 'Draw';
  $('endWin').textContent = (sA===sB?'🤝 ':'🏆 ') + winner;
  $('endMsg').textContent = `${nA}: ${sA}  vs  ${nB}: ${sB}`;
  $('endC').classList.remove('hidden');
  // Log BOTH teams to leaderboard
  const rA = sA>sB?'🏆 Win':sB>sA?'❌ Loss':'🤝 Draw';
  const rB = sB>sA?'🏆 Win':sA>sB?'❌ Loss':'🤝 Draw';
  lbAdd({game:'Team vs Team', name:nA, score:sA, detail:`${rA} vs ${nB} (${sA}-${sB})`});
  lbAdd({game:'Team vs Team', name:nB, score:sB, detail:`${rB} vs ${nA} (${sB}-${sA})`});
}
function resetAll(){
  sA=sB=0; cur=null;
  $('sA').textContent=0; $('sB').textContent=0;
  $('q').textContent='Press Next ▶';
  $('answer').textContent='_';
  $('endC').classList.add('hidden');
}
</script>
</body></html>
